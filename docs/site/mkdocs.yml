site_name: EmailBridge
site_description: Open-source mail gateway — IMAP/SMTP, durable send queue, signed webhooks
site_url: https://radiobros.github.io/emailBridge/
repo_url: https://github.com/radioBros/emailBridge
repo_name: radioBros/emailBridge
edit_uri: ""

docs_dir: content
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Install:
      - Overview: install/index.md
      - Small (Compose): install/compose-small.md
      - Medium (Compose): install/compose-medium.md
      - Quadlet: install/quadlet.md
      - Helm: install/helm.md
      - AWS (Terraform): install/aws.md
  - Configuration: configuration/index.md
  - API: api/index.md
  - Webhooks:
      - Overview: webhooks/index.md
      - Filters & maps: webhooks/filters.md
  - Integrations:
      - Overview: integrations/index.md
      - Slack: integrations/slack.md
      - Microsoft Teams: integrations/teams.md
      - Discord: integrations/discord.md
      - Telegram: integrations/telegram.md
      - Mattermost: integrations/mattermost.md
      - FeatherDesk: integrations/featherdesk.md
      - Generic helpdesk: integrations/helpdesk.md
  - SDKs: sdks/index.md
  - Operations:
      - Overview: operations/index.md
      - Medium tier: operations/medium.md
      - Large tier: operations/large.md
      - Observability: operations/observability.md
      - Simulator: operations/simulator.md
