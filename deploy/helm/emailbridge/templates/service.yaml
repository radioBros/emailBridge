{{- if .Values.roles.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "emailbridge.fullname" . }}
  labels:
    {{- include "emailbridge.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "emailbridge.componentSelectorLabels" (dict "root" . "component" "api") | nindent 4 }}
{{- end }}
{{- if .Values.roles.webhook.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "emailbridge.fullname" . }}-webhook
  labels:
    {{- include "emailbridge.componentLabels" (dict "root" . "component" "webhook") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "emailbridge.componentSelectorLabels" (dict "root" . "component" "webhook") | nindent 4 }}
{{- end }}
