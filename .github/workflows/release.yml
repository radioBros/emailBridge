# Release — on tag v*: multi-arch image, SBOM, cosign keyless.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/emailbridge

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        run: |
          set -euo pipefail
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          image="${{ env.REGISTRY }}/${owner}/emailbridge"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tags=${image}:${GITHUB_REF_NAME},${image}:latest" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: deploy/container/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
          provenance: true
          sbom: false
      - uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2
      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: SBOM (Syft CycloneDX + SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: emailbridge-${{ github.ref_name }}.cdx.json
          upload-artifact: true
          upload-release-assets: false
      - name: SBOM SPDX
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: emailbridge-${{ github.ref_name }}.spdx.json
          upload-artifact: true
          upload-release-assets: false
      - name: Attest SBOM (CycloneDX)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          set -euo pipefail
          cosign attest --yes --type cyclonedx \
            --predicate "emailbridge-${GITHUB_REF_NAME}.cdx.json" \
            "${IMAGE}@${DIGEST}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: |
            emailbridge-${{ github.ref_name }}.cdx.json
            emailbridge-${{ github.ref_name }}.spdx.json

  github-release:
    needs: [image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: sbom
          path: artifacts
      - name: Checksums and changelog
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum * > SHA256SUMS
          prev=$(git -C "$GITHUB_WORKSPACE" describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## EmailBridge ${GITHUB_REF_NAME}"
            echo
            echo "Image: \`${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}\`"
            echo
            echo "Signed with cosign keyless; SBOM attached (CycloneDX + SPDX)."
            echo
            echo "### Changelog"
            echo
            if [ -n "$prev" ]; then
              git -C "$GITHUB_WORKSPACE" log --pretty=format:'- %s (%h)' "${prev}..${GITHUB_REF_NAME}"
            else
              git -C "$GITHUB_WORKSPACE" log --pretty=format:'- %s (%h)' "${GITHUB_REF_NAME}"
            fi
            echo
          } > "$GITHUB_WORKSPACE/RELEASE_NOTES.md"
      - uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
