# SDKs + shipped simulator.
name: sdks

on:
  push:
    paths:
      - "sdk/**"
      - "api/openapi/**"
      - "cmd/emailbridge-sim/**"
      - ".github/workflows/sdks.yml"
  pull_request:
    paths:
      - "sdk/**"
      - "api/openapi/**"
      - "cmd/emailbridge-sim/**"
      - ".github/workflows/sdks.yml"

permissions:
  contents: read

concurrency:
  group: sdks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-sdk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: regenerate OpenAPI client
        run: go generate ./openapi/...
      - name: check generated drift
        run: git diff --exit-code -- openapi/client.gen.go
      - name: go test
        run: go test ./...
      - name: client coverage
        run: |
          go test -coverprofile=cover-client.out ./client/
          go tool cover -func=cover-client.out | tee cover-client.txt
          awk '/total:/ { gsub(/%/, "", $NF); if ($NF+0 < 85) { print "coverage below 85%: " $NF; exit 1 } }' cover-client.txt

  typescript:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm run generate
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npm test

  python:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: sh scripts/generate
      - run: pytest

  php:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sdk/php
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@2282b6a082fc605c8320908a4cca3a5d1ca6c6fe # v2.35.1
        with:
          php-version: "8.3"
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: sh scripts/generate
      - run: vendor/bin/phpunit

  simulator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: build emailbridge-sim
        run: go build -trimpath -o dist/emailbridge-sim ./cmd/emailbridge-sim
