# Docs site — MkDocs Material. Static artifact; publishing to Pages is manual.
name: docs

on:
  push:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build MkDocs Material site
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/docs" \
            -w /docs/docs/site \
            squidfunk/mkdocs-material:9.6.14 \
            build --strict
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-site
          path: docs/site/site
          if-no-files-found: error

