name: Feature request
description: Propose a new capability or change
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve, and who hits it?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you would like it to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why they fall short.
    validations:
      required: false
  - type: dropdown
    id: switch-scope
    attributes:
      label: Switch scope
      description: Every optional feature needs a switch. Which scope should it use?
      options:
        - global
        - organisation
        - account
        - endpoint
        - not sure / not optional
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - accounts
        - sync
        - sending
        - webhooks
        - rules
        - admin UI
        - API
        - deployment
        - integrations
        - other
    validations:
      required: true
